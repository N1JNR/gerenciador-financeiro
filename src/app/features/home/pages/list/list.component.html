<app-balance [transactions]="transactions()"></app-balance>

<div class="actions">
  <a matButton="filled" routerLink="create">adicionar transação</a>
</div>

<app-transactions-container [transactions]="transactions()">

 <ng-template #item let-item="item">
  <app-transaction-item
    class="transaction"
    [transaction]="item"
    (edit)="edit($event)"
    (remove)="remove($event)"
  ></app-transaction-item>
  </ng-template>

  <ng-template #noItems>
    <app-no-transactions></app-no-transactions>
  </ng-template>

</app-transactions-container>
